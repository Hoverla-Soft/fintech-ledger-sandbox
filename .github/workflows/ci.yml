name: CI

# Runs exactly the five commands a task file's Verification block declares
# (docs/tasks/TEMPLATE.md). If this workflow and that block ever diverge, the
# block is the source of truth — fix the workflow, never weaken the block.
on:
  push:
    branches: [main]
  pull_request:

# The workflow reads code and nothing else. No repository secrets are used, and
# nothing here writes to the repo, publishes, or deploys.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # `apps/server/.env` and `apps/web/.env` are gitignored, so a CI checkout
      # has neither, and `packages/env` validates at import time with Zod. These
      # are throwaway values that satisfy the schema; they are NOT secrets and
      # must never become real ones.
      #
      # Set explicitly rather than via SKIP_ENV_VALIDATION, deliberately: the
      # skip flag would let a genuinely missing or malformed variable through
      # unnoticed, which is the same class of failure as a lint script that
      # checks nothing.
      BETTER_AUTH_SECRET: ci-not-a-secret-value-at-least-32-chars-long
      BETTER_AUTH_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3001
      DATABASE_URL: postgresql://postgres:password@localhost:5432/fintech-ledger-sandbox
      VITE_SERVER_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.31.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Deliberately NOT a `services: postgres:` block. The `packages/db` and
      # `packages/api` suites use @testcontainers/postgresql, which starts and
      # migrates its own `postgres:18` container per suite (see
      # packages/db/src/test/setup.ts). What they need is a reachable Docker
      # daemon, which ubuntu-latest provides natively — a service container
      # would sit idle beside the one Testcontainers actually uses.
      - name: Verify Docker is available for Testcontainers
        run: docker info > /dev/null

      # Closes the second half of open question #18. Threshold is `high`, not
      # `moderate`, and that is a deliberate, temporary compromise rather than a
      # convenient one: three moderates are currently unfixable without a
      # major-version override that would break the package asking for them
      # (`esbuild` via drizzle-kit's deprecated @esbuild-kit chain, `uuid` via
      # autocannon>hyperid, `hono` via packages/ui>shadcn). Gating at `moderate`
      # today would mean a permanently red build, which teaches people to ignore
      # the check — the same failure mode open question #17 records for CI that
      # reports but does not gate.
      #
      # Each is written up in docs/open-questions.md #18. Lower this to
      # `moderate` the moment that list is empty.
      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check-types

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Migration integrity guard
        run: node .claude/scripts/migration-integrity-guard.js --check
