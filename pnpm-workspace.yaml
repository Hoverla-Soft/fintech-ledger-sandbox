packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
catalog:
  dotenv: ^17.4.2
  zod: ^4.4.3
  typescript: ^6
  "@types/node": ^22.13.14
  # Floor is a security minimum, not a preference: 4.12.34 patches four
  # advisories against `apps/server`'s request path. `^4.12.27` already *allowed*
  # the fix, but the lockfile stayed resolved at 4.12.32 — a caret range does not
  # pull a patch nobody asks for. Raise the floor so the advisory cannot come
  # back on a fresh `pnpm install`.
  hono: ^4.12.34
  "@orpc/server": ^1.15.0
  "@orpc/openapi": ^1.15.0
  "@orpc/zod": ^1.15.0
  better-auth: 1.6.27
  lucide-react: ^1.31.0
  next-themes: ^0.4.6
  react: ^19.2.7
  react-dom: ^19.2.7
  sonner: ^2.0.8
  "@orpc/client": ^1.15.0
  # Versioned in lockstep with @orpc/server (both on the 1.15.x release train),
  # so it cannot drift from the server it plugs into. See ADR 0007. Keep the two
  # ranges moving together — that lockstep is the whole reason an `experimental`
  # package is acceptable here.
  "@orpc/experimental-ratelimit": ^1.15.0
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
  tailwindcss: ^4.3.2
  vitest: ^4.1.10
  "@testcontainers/postgresql": ^12.1.0
  # The `apps/web` console suite (Phase 5a). `packages/*` suites are Node-environment
  # and need none of this; the console's highest-risk behaviours are DOM-bound
  # ("the dialog closes only after the request resolves", "submit is disabled in
  # flight", "the form stays open with the reason inline"), so they need a real
  # document. See docs/development/tech-stack.md → Testing framework.
  happy-dom: ^20.11.2
  # v16 is the first line supporting React 19's createRoot/act contract.
  "@testing-library/react": ^16.3.2
  "@testing-library/user-event": ^14.6.4
  "@testing-library/jest-dom": ^7.0.1
  # Linter *and* formatter, one binary (Phase 6a). Catalogued so all 8 workspace
  # packages resolve the identical version — a formatter that differs by package
  # would rewrite the same file two ways depending on who ran it last.
  "@biomejs/biome": ^2.5.8
  # End-to-end (Phase 6c). Lives in `apps/web`; replaces the manual demo
  # scripts every Phase 5 slice carried as acceptance criteria.
  "@playwright/test": ^1.62.1
  # The structured logger `docs/development/tech-stack.md` has declared since
  # Phase 4b and which no phase ever delivered — installed 2026-08-16, closing
  # the ⚠️ row in `docs/showcase/security.md`. Chosen there, not here: this is
  # the library the stack doc already named, so installing it is delivery, not
  # a new dependency decision. No `pino-pretty`: it is a second dependency
  # whose only job is making dev output readable, and `pino.transport` would
  # add a worker thread per process for that. Dev readability is handled with
  # a plain formatter instead.
  pino: ^10.3.1

# Advisories in packages nothing here depends on directly — they arrive through
# a dependency's dependency, so no manifest edit can reach them. Both entries
# below are *patch* bumps inside the version their consumer already asked for,
# which is why an override is safe here and would not be for a major.
#
# Reviewed on every `pnpm audit` failure: an override that outlives the advisory
# is a pin nobody remembers agreeing to. Delete an entry once the upstream
# dependency has moved past it on its own.
overrides:
  # HIGH, GHSA-2v37-7h3g-55p8 — unbounded loop when a custom generator is given
  # size 0. Reaches us via apps/web > vite > postcss.
  # Upper bound is load-bearing: postcss asks for nanoid ^3, and an open-ended
  # ">=3.3.18" resolves to 6.x, which is a different (ESM-only) package.
  nanoid@<3.3.18: ">=3.3.18 <4"
  # HIGH, GHSA-rgw5-rvv9-x895 — ReDoS. Reaches us via packages/db >
  # @testcontainers/postgresql > testcontainers > archiver > glob > minimatch.
  # Dev-only, but a ReDoS in a test runner still burns CI minutes.
  # Same upper-bound reasoning: minimatch asks for ^2.0.1.
  brace-expansion@>=2.0.0 <2.1.4: ">=2.1.4 <3"
